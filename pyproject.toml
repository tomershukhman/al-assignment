[project]
name = "al-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.12.0",
    "pydantic>=2.12.5",
    "python-multipart>=0.0.22",
    "sqlmodel>=0.0.31",
    "uvicorn>=0.40.0",
    "loguru>=0.7.3",
    "anthropic>=0.76.0",
    "pyrefly>=0.50.1",
    "google-genai>=0.3.0",
    "langgraph>=1.0.6",
    "langchain-google-genai>=2.0.8",
]

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.2",
]
